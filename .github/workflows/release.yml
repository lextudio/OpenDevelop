name: Release

# Pushing a vMAJOR.MINOR.PATCH[-suffix] tag packages every distribution and leaves a DRAFT release for review. A draft is
# never "latest", so the IDE's update check (api.github.com/.../releases/latest) is not triggered until someone has read the
# notes and published it: `gh release edit <tag> --draft=false`, or the Publish button.
#
# Conventions carried over from the manual releases (v5.6.0 - v5.6.3): the title is the tag, the assets keep the fixed names
# OpenDevelop-win.7z, OpenDevelop-macos.dmg, OpenDevelop-linux-x64.tar.xz and OpenDevelop-linux-arm64.tar.xz (so
# releases/latest/download/<name> stays a stable link), and the notes follow .github/release-notes.template.md. A tag with a
# suffix (v5.6.5-rc1) becomes a prerelease, which makes it a safe dry run. Put the "Changes since" bullets in
# doc/releases/<tag>.md before tagging.
#
# The Windows 7z and the Linux tar.xz replace the ZIPs those releases shipped. Both payloads carry the same dependency
# closure at the application root and inside every out-of-process child host, so a ZIP stored 63% of its bytes more
# than once (measured: 2443 MB of payload, 908 MB of unique content, 828 MB of ZIP). A solid 7z block, and tar's hardlink entries after
# the payload's duplicate files are hardlinked, pay for a duplicate once.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read
  # LibreWPF, LibreWinForms, AvalonEdit, AvalonDock and LibGhostty.Net come from this organization's packages.
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # Same convention as ci.yml: NuGet reads the token from here without writing it to NuGet.config.
  NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is a release version, on master, with a green CI run, and not released yet
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]."; exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master. Release from master."; exit 1
          fi
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [[ "$green" -lt 1 ]]; then
            # Escape hatch for a release whose CI is red only for infrastructure reasons (hosted
            # macOS runners that never arrive and time out as "cancelled"). Set the repository
            # variable for one release, then delete it, so the gate stays on by default.
            if [[ "${{ vars.RELEASE_SKIP_CI_GATE }}" == "true" ]]; then
              echo "::warning::No successful CI run exists for $GITHUB_SHA; continuing because RELEASE_SKIP_CI_GATE is true."
            else
              echo "::error::No successful CI run exists for $GITHUB_SHA. Run ci.yml on this commit first (a push to master, or a dispatch)."; exit 1
            fi
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists."; exit 1
          fi
          echo "$GITHUB_REF_NAME: on master, $green successful CI run(s), no release yet."

  windows:
    name: Package Windows
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps its version from git history (GitVersion).
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64
      # One payload serves x64 and ARM64 (dist.ps1 builds both launchers and runs its own smoke phase). GitVersion's GitHub
      # Actions integration races on the runner's env file when projects build in parallel (see build-binaries.ps1), so the
      # variable that enables it is removed for the packaging.
      - name: Build the unified Windows distribution
        shell: cmd
        run: |
          set "GITHUB_ACTIONS="
          rem No gh credential can read the lextudio feed with this ephemeral token; NuGet restores
          rem the same closure from GitHub Packages with the credential the job env provides.
          dist.windows.bat --skip-feed-sync
      # The bitness journeys debug a framework-dependent fixture built for another architecture, so
      # the runner needs that architecture's runtime - the same thing a user who debugs an x86 (or,
      # on ARM64, an x64) application has installed. Nothing is bundled into the artifact: the
      # product still requires the user's .NET 10 runtime. dotnet-install does not register the
      # install for the apphost, so point it there explicitly.
      - name: Install the runtimes the bitness journeys debug
        shell: pwsh
        run: |
          $architectures = if ($env:RUNNER_ARCH -eq 'ARM64') { @('x64', 'x86') } else { @('x86') }
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          foreach ($architecture in $architectures) {
            $installDir = switch ($architecture) {
              'x86' { "${env:ProgramFiles(x86)}\dotnet" }
              'x64' { "$env:ProgramFiles\dotnet\x64" }
            }
            & "$env:RUNNER_TEMP/dotnet-install.ps1" -Runtime dotnet -Channel 10.0 -Architecture $architecture -InstallDir $installDir -NoPath
            # $LASTEXITCODE is not set by a PowerShell script, only by a native command, so check
            # what the install actually produced.
            if (-not (Get-ChildItem -Path (Join-Path $installDir 'shared/Microsoft.NETCore.App') -Directory -ErrorAction SilentlyContinue)) {
              throw "the $architecture runtime did not install into $installDir"
            }
            if ($architecture -eq 'x86') { "DOTNET_ROOT_X86=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
            if ($architecture -eq 'x64') { "DOTNET_ROOT_X64=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }
          dotnet --list-runtimes
      # The packaged payload is what users get, and its per-RID assets exist only so a project built
      # for another bitness can be designed and debugged. Prove that on the artifact itself rather
      # than on a development tree: the x64 runner debugs x64 and x86, the ARM64 runner debugs
      # arm64, x64 and x86 through Windows' emulation. A pruned runtime pack or debugger shim turns
      # this step red instead of reaching users.
      - name: Verify the packaged payload by bitness
        shell: pwsh
        run: |
          $targets = if ($env:RUNNER_ARCH -eq 'ARM64') { @('win-arm64', 'win-x64', 'win-x86') } else { @('win-x64', 'win-x86') }
          ./build/windows/verify-packaged-app.ps1 -PayloadRoot OpenDevelop-win -Targets $targets -SkipDebugJourneys
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: OpenDevelop-win.7z
          if-no-files-found: error
  macos:
    name: Package macOS ARM64
    needs: prepare
    # The same image ci.yml builds macOS on; dist.macos.sh probes for a linking toolchain and is sensitive to the SDK.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: arm64
      - name: Build the macOS ARM64 distribution
        run: |
          unset GITHUB_ACTIONS
          # No gh credential can read the lextudio feed with this ephemeral token; NuGet restores
          # the same closure from GitHub Packages with the credential the job env provides.
          ./dist.macos.sh --skip-feed-sync
      # dist.macos.sh verifies that the bundle renders its first workbench window.  Keep the
      # release gate stronger: run the assembled .app itself, not project output, through the
      # principal add-in/child-process paths before the DMG is allowed to leave this checkout.
      - name: Verify packaged macOS application features
        shell: bash
        env:
          # Keep the debugger breakpoint journey mandatory in the release checkout,
          # including if GitHub upgrades its macOS image.
          OD_BUNDLE_VERIFY_REQUIRE_DEBUGGER: '1'
        run: build/macos/verify-application-bundle.sh OpenDevelop.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: OpenDevelop-macos.dmg
          if-no-files-found: error

  linux:
    name: Package Linux (${{ matrix.rid }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            dotnet_architecture: x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            dotnet_architecture: arm64
    # Each architecture is built on a native runner: there is no cross-architecture Linux payload. ci.yml runs the same
    # steps on every master push, so a release that reaches this job has already seen them pass on this commit.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Install Linux display and native runtime prerequisites
        shell: bash
        run: |
          # No GPU on hosted runners: wgpu-native needs a software Vulkan driver (lavapipe) to create a surface.
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libx11-xcb1 libxkbcommon0 libgl1 libvulkan1 mesa-vulkan-drivers
      # dist.linux.sh starts the packaged app and requires its first workbench render before it writes the tar.xz.
      - name: Build and smoke-test the native Linux payload
        shell: bash
        run: |
          unset GITHUB_ACTIONS
          xvfb-run -a bash dist.linux.sh --skip-feed-sync
          test -f "OpenDevelop-${{ matrix.rid }}.tar.xz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: OpenDevelop-${{ matrix.rid }}.tar.xz
          if-no-files-found: error

  draft:
    name: Draft the GitHub Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/release
          merge-multiple: true
      - id: notes
        name: Render the notes
        shell: pwsh
        run: ./.github/ci/release-notes.ps1 -Tag '${{ github.ref_name }}' -Output release-notes.md
      - name: Create the draft and attach every asset
        shell: bash
        run: |
          set -euo pipefail
          ls -l artifacts/release
          assets=(OpenDevelop-win.7z OpenDevelop-macos.dmg OpenDevelop-linux-x64.tar.xz OpenDevelop-linux-arm64.tar.xz)
          for asset in "${assets[@]}"; do
            [[ -f "artifacts/release/$asset" ]] || { echo "::error::$asset was not produced."; exit 1; }
          done
          flags=()
          [[ "${{ steps.notes.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          # A failure after this point leaves a recoverable draft, never a partial public release.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]/#/artifacts/release/}"
          {
            echo "### $GITHUB_REF_NAME drafted"
            echo
            echo "- Notes bullets came from: **${{ steps.notes.outputs.bullets }}** (previous version: ${{ steps.notes.outputs.previous }})"
            echo "- Review it, then publish: \`gh release edit $GITHUB_REF_NAME --draft=false\`"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
