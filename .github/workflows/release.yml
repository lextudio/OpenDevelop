name: Release

# Pushing a vMAJOR.MINOR.PATCH[-suffix] tag packages every distribution and leaves a DRAFT release for review. A draft is
# never "latest", so the IDE's update check (api.github.com/.../releases/latest) is not triggered until someone has read the
# notes and published it: `gh release edit <tag> --draft=false`, or the Publish button.
#
# Conventions carried over from the manual releases (v5.6.0 - v5.6.3): the title is the tag, the assets keep the fixed names
# OpenDevelop-win.7z, OpenDevelop-macos.dmg, OpenDevelop-linux-x64.tar.xz and OpenDevelop-linux-arm64.tar.xz (so
# releases/latest/download/<name> stays a stable link), and the notes follow .github/release-notes.template.md. A tag with a
# suffix (v5.6.5-rc1) becomes a prerelease, which makes it a safe dry run. Put the "Changes since" bullets in
# doc/releases/<tag>.md before tagging. A manual dispatch is a rehearsal: it builds and verifies every distribution from
# the chosen ref, skips the tag checks and drafts nothing.
#
# Shape, the same for every platform the release ships:
#   package-* -> builds one distribution (Release) on a native runner; dist.* runs its own start-up smoke
#   verify    -> one row per shipped platform (Windows x64 and ARM64 share one payload; macOS ARM64; Linux x64 and ARM64):
#                on that platform's own runner, takes the file users download (7z, dmg, tar.xz), unpacks it and runs the
#                lean packaged-app check (build/verify-packaged-common.sh, build/windows/verify-packaged-app.ps1)
#   draft     -> only after every row passed
#
# The Windows 7z and the Linux tar.xz replace the ZIPs those releases shipped. Both payloads carry the same dependency
# closure at the application root and inside every out-of-process child host, so a ZIP stored 63% of its bytes more
# than once (measured: 2443 MB of payload, 908 MB of unique content, 828 MB of ZIP). A solid 7z block, and tar's hardlink entries after
# the payload's duplicate files are hardlinked, pay for a duplicate once.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # LibreWPF, LibreWinForms, AvalonEdit, AvalonDock and LibGhostty.Net come from this organization's packages.
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # Same convention as ci.yml: NuGet reads the token from here without writing it to NuGet.config.
  NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is a release version, on master, with a release-grade CI run, and not released yet
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]."; exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master. Release from master."; exit 1
          fi
          # A green run is not enough: only a run that executed the full plan on this
          # commit uploads the 'release-grade' artifact (ci.yml, job "Release grade"). A focus-mode or narrowed run is
          # green and has none.
          green=0
          for run_id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id'); do
            marker=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=release-grade" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [[ "$marker" -ge 1 ]]; then green=$((green + 1)); fi
          done
          if [[ "$green" -lt 1 ]]; then
            # Escape hatch for a release whose CI is red only for infrastructure reasons (hosted
            # macOS runners that never arrive and time out as "cancelled"). Set the repository
            # variable for one release, then delete it, so the gate stays on by default.
            if [[ "${{ vars.RELEASE_SKIP_CI_GATE }}" == "true" ]]; then
              echo "::warning::No release-grade CI run exists for $GITHUB_SHA; continuing because RELEASE_SKIP_CI_GATE is true."
            else
              echo "::error::No release-grade CI run exists for $GITHUB_SHA. Dispatch ci.yml on this commit with full=true and no through_batch/platforms (a plain push is release-grade only when the plan is not in focus mode)."; exit 1
            fi
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::A release for $GITHUB_REF_NAME already exists."; exit 1
          fi
          echo "$GITHUB_REF_NAME: on master, $green release-grade CI run(s), no release yet."

  package-windows:
    name: Package Windows
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamps its version from git history (GitVersion).
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: x64
      # The sharing rules decide which host copies are deleted, and a mistake there only surfaces as
      # a packaged designer child that cannot load an assembly - after the whole payload build. This
      # synthetic payload pins both rules (no store entry for an identity with two contents, a store
      # entry for an identical one) in seconds.
      - name: Test the payload sharing rules
        shell: pwsh
        run: ./build/windows/test-share-managed-payload.ps1
      # One payload serves x64 and ARM64 (dist.ps1 builds both launchers and runs its own smoke phase). GitVersion's GitHub
      # Actions integration races on the runner's env file when projects build in parallel (see build-binaries.ps1), so the
      # variable that enables it is removed for the packaging.
      - name: Build the unified Windows distribution
        shell: cmd
        env:
          # Collapses the designer hosts' duplicated managed closure into shared/managed; the
          # bitness step below starts a real designer host and would fail if it were incomplete.
          OD_SHARE_MANAGED_CLOSURE: '1'
        run: |
          set "GITHUB_ACTIONS="
          rem No gh credential can read the lextudio feed with this ephemeral token; NuGet restores
          rem the same closure from GitHub Packages with the credential the job env provides.
          dist.windows.bat --skip-feed-sync
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: OpenDevelop-win.7z
          if-no-files-found: error

  package-macos:
    name: Package macOS ARM64
    needs: prepare
    # The same image ci.yml runs macOS on; dist.macos.sh probes for a linking toolchain and is sensitive to the SDK.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: arm64
      - name: Build the macOS ARM64 distribution
        run: |
          unset GITHUB_ACTIONS
          # No gh credential can read the lextudio feed with this ephemeral token; NuGet restores
          # the same closure from GitHub Packages with the credential the job env provides.
          ./dist.macos.sh --skip-feed-sync
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: OpenDevelop-macos.dmg
          if-no-files-found: error

  package-linux:
    name: Package Linux (${{ matrix.rid }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            dotnet_architecture: x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            dotnet_architecture: arm64
    # Each architecture is built on a native runner: there is no cross-architecture Linux payload.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Install Linux display and native runtime prerequisites, and reclaim disk space
        shell: bash
        run: bash .github/ci/install-linux-prerequisites.sh --display --reclaim-disk
      # dist.linux.sh starts the packaged app and requires its first workbench render before it writes the tar.xz.
      - name: Build and smoke-test the native Linux payload
        shell: bash
        run: |
          # GitVersion's GitHub Actions integration races on the runner's env file when projects build in parallel.
          unset GITHUB_ACTIONS
          xvfb-run -a bash dist.linux.sh --skip-feed-sync
          test -f "OpenDevelop-${{ matrix.rid }}.tar.xz"
          module="OpenDevelop-${{ matrix.rid }}/AddIns/Misc/PackageManagement/Scripts/OpenDevelop.PackageManagement.ps1"
          test -f "$module"
          pwsh -NoProfile -Command ". '$module'; foreach (\$name in 'Get-Package','Install-Package','Update-Package','Uninstall-Package') { Get-Command \$name -ErrorAction Stop | Out-Null }"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: OpenDevelop-${{ matrix.rid }}.tar.xz
          if-no-files-found: error

  # The smoke phase inside dist only proves a payload starts and paints one frame. Each row runs the lean packaged-app
  # check on the file users download, unpacked on that platform's own runner: the Windows payload is built once on x64 and
  # verified on x64 and on ARM64, where it had never been checked before; macOS mounts the DMG; Linux unpacks the tar.xz,
  # which also catches what archiving loses (modes, symlinks, paths). The debugger breakpoint journey is mandatory.
  verify:
    name: Verify ${{ matrix.platform }}
    needs: [package-windows, package-macos, package-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            dotnet_architecture: x64
            artifact: release-windows
            file: OpenDevelop-win.7z
            # The x64 runner can debug x64 and, through WOW64, x86.
            targets: win-x64,win-x86
          - platform: windows-arm64
            runner: windows-11-arm
            dotnet_architecture: arm64
            artifact: release-windows
            file: OpenDevelop-win.7z
            # The ARM64 runner can debug arm64, and x64 and x86 through Windows' emulation.
            targets: win-arm64,win-x64,win-x86
          - platform: macos-arm64
            runner: macos-15
            dotnet_architecture: arm64
            artifact: release-macos-arm64
            file: OpenDevelop-macos.dmg
          - platform: linux-x64
            runner: ubuntu-24.04
            dotnet_architecture: x64
            artifact: release-linux-x64
            file: OpenDevelop-linux-x64.tar.xz
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            dotnet_architecture: arm64
            artifact: release-linux-arm64
            file: OpenDevelop-linux-arm64.tar.xz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      OD_VERIFY_REQUIRE_DEBUGGER: '1'
    steps:
      # The checks drive the app against the repository's fixtures (some from submodules); nothing here builds the product.
      - uses: actions/checkout@v7
      - name: Initialize the submodules the fixtures need
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Install Linux display and native runtime prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/ci/install-linux-prerequisites.sh --display
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/download
      - name: Verify the shipped Windows payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'payload'
          $archive = Join-Path $env:RUNNER_TEMP 'download/${{ matrix.file }}'
          # dist.ps1 writes the archive with 7-Zip; use the same tool when the image has it.
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          if (Test-Path $sevenZip) { & $sevenZip x $archive "-o$extract" -y | Out-Null } else { tar -xf $archive -C (New-Item -ItemType Directory -Force $extract).FullName }
          if ($LASTEXITCODE -ne 0) { throw "could not extract $archive" }
          $payload = Get-ChildItem -LiteralPath $extract -Recurse -Depth 1 -Filter OpenDevelop.dll | Select-Object -First 1
          if (-not $payload) { throw 'OpenDevelop.dll not found in the extracted archive' }
          # -SkipDebugJourneys skips only the per-RID bitness journeys, which are being rebuilt around an apphost; when they
          # return, this job must also install the x86 (and on ARM64 the x64) .NET runtime they debug (dotnet-install.ps1).
          ./build/windows/verify-packaged-app.ps1 -PayloadRoot $payload.DirectoryName -Targets ('${{ matrix.targets }}' -split ',') -SkipDebugJourneys
      - name: Verify the shipped macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mount="$RUNNER_TEMP/dmg"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$mount" "$RUNNER_TEMP/download/${{ matrix.file }}"
          # Run a copy, as a user does after dragging it to Applications, not the read-only volume.
          ditto "$mount/OpenDevelop.app" "$RUNNER_TEMP/OpenDevelop.app"
          hdiutil detach "$mount" -quiet || hdiutil detach "$mount" -force
          build/macos/verify-application-bundle.sh "$RUNNER_TEMP/OpenDevelop.app"
      - name: Verify the shipped Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          extract="$RUNNER_TEMP/payload"
          mkdir -p "$extract"
          tar -xJf "$RUNNER_TEMP/download/${{ matrix.file }}" -C "$extract"
          payload=$(find "$extract" -maxdepth 2 -name OpenDevelop.dll -printf '%h\n' -quit)
          test -n "$payload" || { echo '::error::OpenDevelop.dll not found in the extracted archive'; exit 1; }
          xvfb-run -a ./build/linux/verify-application-payload.sh "$payload"

  draft:
    name: Draft the GitHub Release
    needs: verify
    # A manual dispatch is a rehearsal and drafts nothing.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/release
          merge-multiple: true
      - id: notes
        name: Render the notes
        shell: pwsh
        run: ./.github/ci/release-notes.ps1 -Tag '${{ github.ref_name }}' -Output release-notes.md
      - name: Create the draft and attach every asset
        shell: bash
        run: |
          set -euo pipefail
          ls -l artifacts/release
          assets=(OpenDevelop-win.7z OpenDevelop-macos.dmg OpenDevelop-linux-x64.tar.xz OpenDevelop-linux-arm64.tar.xz)
          for asset in "${assets[@]}"; do
            [[ -f "artifacts/release/$asset" ]] || { echo "::error::$asset was not produced."; exit 1; }
          done
          flags=()
          [[ "${{ steps.notes.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          # A failure after this point leaves a recoverable draft, never a partial public release.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${assets[@]/#/artifacts/release/}"
          {
            echo "### $GITHUB_REF_NAME drafted"
            echo
            echo "- Notes bullets came from: **${{ steps.notes.outputs.bullets }}** (previous version: ${{ steps.notes.outputs.previous }})"
            echo "- Review it, then publish: \`gh release edit $GITHUB_REF_NAME --draft=false\`"
            echo "- https://github.com/$GITHUB_REPOSITORY/releases"
          } >> "$GITHUB_STEP_SUMMARY"
