name: Terminal integration

# This is intentionally a Terminal-only integration lane.  It is not a general replacement for
# the platform matrix: its build excludes the rest of the runtime-discovered add-ins and fixtures.
on:
  push:
    branches: [master]
    paths:
      - 'src/AddIns/Misc/Terminal/**'
      - 'src/Main/Base/**'
      - 'src/Main/Core/**'
      - 'src/Main/ICSharpCode.Core.Presentation/**'
      - 'src/Main/SharpDevelop/**'
      - 'src/Libraries/AvalonEdit'
      - 'src/Libraries/AvalonDock'
      - 'externals/cps'
      - 'externals/wpftoolkit'
      - '.gitmodules'
      - 'tests/OpenDevelop.IntegrationTests/TerminalCrossPlatformTests.cs'
      - 'tests/OpenDevelop.IntegrationTests/TerminalPadTests.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelopAppFixture.cs'
      - 'tests/OpenDevelop.IntegrationTests/FixtureTestCaseOrderer.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelop.IntegrationTests.csproj'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/terminal-cross-platform.yml'
  pull_request:
    paths:
      - 'src/AddIns/Misc/Terminal/**'
      - 'src/Main/Base/**'
      - 'src/Main/Core/**'
      - 'src/Main/ICSharpCode.Core.Presentation/**'
      - 'src/Main/SharpDevelop/**'
      - 'src/Libraries/AvalonEdit'
      - 'src/Libraries/AvalonDock'
      - 'externals/cps'
      - 'externals/wpftoolkit'
      - '.gitmodules'
      - 'tests/OpenDevelop.IntegrationTests/TerminalCrossPlatformTests.cs'
      - 'tests/OpenDevelop.IntegrationTests/TerminalPadTests.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelopAppFixture.cs'
      - 'tests/OpenDevelop.IntegrationTests/FixtureTestCaseOrderer.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelop.IntegrationTests.csproj'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/terminal-cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  terminal:
    name: Terminal (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the two Windows architectures as separate native jobs. A successful x64 run must
          # never be taken as evidence that the ARM64 ConPTY/LibGhostty asset chain also works.
          - name: windows-x64
            runner: windows-2025
            dotnet_architecture: x64
            rid: win-x64
            expected_rid: win-x64
            test_class: OpenDevelop.IntegrationTests.TerminalCrossPlatformTests
            timeout: 25
          - name: windows-arm64
            runner: windows-11-arm
            dotnet_architecture: arm64
            rid: win-arm64
            expected_rid: win-arm64
            test_class: OpenDevelop.IntegrationTests.TerminalCrossPlatformTests
            timeout: 25
          # TerminalPadTests deliberately exercises POSIX terminal semantics (alternate screen,
          # stty, shell programs and macOS key handling) on a native Apple Silicon runner.
          - name: macos-arm64
            runner: macos-15
            dotnet_architecture: arm64
            rid: osx-arm64
            expected_rid: osx-arm64
            test_class: OpenDevelop.IntegrationTests.TerminalPadTests
            timeout: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize host UI submodules
        run: |
          git submodule update --init src/Libraries/AvalonEdit src/Libraries/AvalonDock externals/cps externals/wpftoolkit
          git -C externals/cps submodule update --init
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      # The full macOS journey validates actual key and pointer delivery. Its test host invokes
      # cliclick rather than simulating those events inside the process, so provision it explicitly
      # instead of depending on the mutable runner image.
      - name: Install macOS native input helper
        if: runner.os == 'macOS'
        run: brew install cliclick
      - name: Record native test environment
        shell: pwsh
        run: |
          Write-Host "runner=${{ matrix.name }}"
          Write-Host "runner.os=$env:RUNNER_OS"
          Write-Host "runner.arch=$env:RUNNER_ARCH"
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
          dotnet --info
      - name: Skip the developer-local LibreWPF feed
        shell: pwsh
        run: |
          [xml]$config = Get-Content NuGet.config
          $source = @($config.configuration.packageSources.add | Where-Object key -eq 'librewpf-local')
          $mapping = @($config.configuration.packageSourceMapping.packageSource | Where-Object key -eq 'librewpf-local')
          foreach ($node in $source + $mapping) { [void]$node.ParentNode.RemoveChild($node) }
          $config.Save((Resolve-Path NuGet.config))
      # Windows intentionally keeps restoring the public nuget.org packages.  The macOS
      # Terminal journey instead consumes the identically-versioned package closure published
      # by OpenAvalon's macOS ARM64 workflow; this isolates the portable text/runtime changes
      # without changing the public package version used by the Windows lanes.  NuGet resolves
      # a package id from the most specific matching mapping pattern, so LibreWPF.* on the
      # GitHub source wins over nuget.org's catch-all '*'.
      - name: Select the OpenAvalon GitHub Packages feed on macOS
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          [xml]$config = Get-Content NuGet.config
          $githubMapping = @($config.configuration.packageSourceMapping.packageSource | Where-Object key -eq 'lextudio-github')
          foreach ($node in $githubMapping) {
            foreach ($pattern in @('LibreWPF', 'LibreWPF.*', 'LibreWinForms', 'LibreWinForms.*', 'ProGPU', 'ProGPU.*')) {
              $package = $config.CreateElement('package')
              [void]$package.SetAttribute('pattern', $pattern)
              [void]$node.AppendChild($package)
            }
          }
          $config.Save((Resolve-Path NuGet.config))
      - name: Clear macOS LibreWPF package cache
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $packages = Join-Path $HOME '.nuget/packages'
          foreach ($prefix in @('librewpf', 'librewinforms', 'progpu')) {
            Get-ChildItem $packages -Directory -Filter "$prefix*" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }
      - name: Authenticate the lextudio package feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget update source lextudio-github --username x-access-token --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build host and Terminal only
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $dotnetInfo = dotnet --info | Out-String
          $expectedRid = '${{ matrix.expected_rid }}'
          $ridPattern = '(?m)^\s*RID:\s+' + [regex]::Escape($expectedRid) + '\s*$'
          if ($dotnetInfo -notmatch $ridPattern) {
            throw "Expected .NET SDK RID $expectedRid. dotnet --info was:`n$dotnetInfo"
          }
          dotnet build src/Main/SharpDevelop/SharpDevelop.csproj --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/AddIns/Misc/Terminal/Project/Terminal.csproj --configuration Debug --runtime $rid -p:AppendRuntimeIdentifierToOutputPath=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OpenDevelop.IntegrationTests/OpenDevelop.IntegrationTests.csproj --configuration Debug -p:BuildIntegrationRuntimeProjects=false -p:BuildIntegrationFixtures=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify macOS LibreWPF package provenance
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $packages = Join-Path $HOME '.nuget/packages'
          $metadata = @(Get-ChildItem $packages -Recurse -Force -Filter '*.nupkg.metadata' |
            Where-Object { $_.FullName -match '/(librewpf|librewinforms|progpu)(\.|/)' })
          if ($metadata.Count -eq 0) { throw 'No LibreWPF, LibreWinForms, or ProGPU package metadata was restored.' }
          $wrongSource = @($metadata | Where-Object {
            (Get-Content $_.FullName -Raw | ConvertFrom-Json).source -ne 'https://nuget.pkg.github.com/lextudio/index.json'
          })
          if ($wrongSource.Count -ne 0) {
            throw "Expected OpenAvalon packages from GitHub Packages, but found: $($wrongSource.FullName -join ', ')"
          }
      - name: Run the Terminal integration journey
        shell: pwsh
        env:
          OD_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/terminal-logs
          OD_TEST_KEEP_ARTIFACTS: '1'
        run: |
          $tests = 'tests/OpenDevelop.IntegrationTests/bin/Debug/net10.0/OpenDevelop.IntegrationTests.dll'
          dotnet $tests -class '${{ matrix.test_class }}' -parallel none
      - name: Upload Terminal diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-diagnostics-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            artifacts/terminal-logs
            ~/Library/Logs/DiagnosticReports/*.ips
