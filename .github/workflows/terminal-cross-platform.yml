name: Terminal Windows ARM64

# This is intentionally a Terminal-only integration lane.  It is not a general replacement for
# the platform matrix: its build excludes the rest of the runtime-discovered add-ins and fixtures.
on:
  push:
    branches: [master]
    paths:
      - 'src/AddIns/Misc/Terminal/**'
      - 'src/Main/Base/**'
      - 'src/Main/Core/**'
      - 'src/Main/ICSharpCode.Core.Presentation/**'
      - 'src/Main/SharpDevelop/**'
      - 'src/Libraries/AvalonEdit'
      - 'src/Libraries/AvalonDock'
      - 'externals/cps'
      - 'externals/wpftoolkit'
      - '.gitmodules'
      - 'tests/OpenDevelop.IntegrationTests/TerminalCrossPlatformTests.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelopAppFixture.cs'
      - 'tests/OpenDevelop.IntegrationTests/FixtureTestCaseOrderer.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelop.IntegrationTests.csproj'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/terminal-cross-platform.yml'
  pull_request:
    paths:
      - 'src/AddIns/Misc/Terminal/**'
      - 'src/Main/Base/**'
      - 'src/Main/Core/**'
      - 'src/Main/ICSharpCode.Core.Presentation/**'
      - 'src/Main/SharpDevelop/**'
      - 'src/Libraries/AvalonEdit'
      - 'src/Libraries/AvalonDock'
      - 'externals/cps'
      - 'externals/wpftoolkit'
      - '.gitmodules'
      - 'tests/OpenDevelop.IntegrationTests/TerminalCrossPlatformTests.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelopAppFixture.cs'
      - 'tests/OpenDevelop.IntegrationTests/FixtureTestCaseOrderer.cs'
      - 'tests/OpenDevelop.IntegrationTests/OpenDevelop.IntegrationTests.csproj'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/terminal-cross-platform.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  terminal:
    name: Terminal (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize host UI submodules
        run: |
          git submodule update --init src/Libraries/AvalonEdit src/Libraries/AvalonDock externals/cps externals/wpftoolkit
          git -C externals/cps submodule update --init
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: arm64
      - name: Skip the developer-local LibreWPF feed
        shell: pwsh
        run: |
          [xml]$config = Get-Content NuGet.config
          $source = @($config.configuration.packageSources.add | Where-Object key -eq 'librewpf-local')
          $mapping = @($config.configuration.packageSourceMapping.packageSource | Where-Object key -eq 'librewpf-local')
          foreach ($node in $source + $mapping) { [void]$node.ParentNode.RemoveChild($node) }
          $config.Save((Resolve-Path NuGet.config))
      - name: Authenticate the lextudio package feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget update source lextudio-github --username x-access-token --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile NuGet.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build host and Terminal only
        shell: pwsh
        run: |
          $rid = 'win-arm64'
          $dotnetInfo = dotnet --info | Out-String
          if ($dotnetInfo -notmatch '(?m)^\s*RID:\s+win-arm64\s*$') {
            throw "Expected the ARM64 .NET SDK. dotnet --info was:`n$dotnetInfo"
          }
          dotnet build src/Main/SharpDevelop/SharpDevelop.csproj --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src/AddIns/Misc/Terminal/Project/Terminal.csproj --configuration Debug --runtime $rid -p:AppendRuntimeIdentifierToOutputPath=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OpenDevelop.IntegrationTests/OpenDevelop.IntegrationTests.csproj --configuration Debug -p:BuildIntegrationRuntimeProjects=false -p:BuildIntegrationFixtures=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the Terminal integration journey
        shell: pwsh
        run: |
          $tests = 'tests/OpenDevelop.IntegrationTests/bin/Debug/net10.0/OpenDevelop.IntegrationTests.dll'
          dotnet $tests -class OpenDevelop.IntegrationTests.TerminalCrossPlatformTests -parallel none
