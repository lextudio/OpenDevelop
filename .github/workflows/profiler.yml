name: Profiler

# The Profiler's data layer (capture through DiagnosticsClient, TraceEvent parsing, aggregation, heap graph)
# has no WPF or IDE dependency, so its tests run on every platform OpenDevelop targets. They start a real
# .NET process (tests/fixtures/ProfilerFixture), attach to it, hold it at startup through a diagnostic port,
# and read the captures back, which is what exercises the parts that differ per operating system: the
# diagnostic-port address (a named pipe on Windows, a socket in the temp folder elsewhere) and process discovery.
on:
  push:
    branches: [master]
    paths:
      - 'src/AddIns/Analysis/Profiler/Core/**'
      - 'tests/OpenDevelop.Profiler.Tests/**'
      - 'tests/fixtures/ProfilerFixture/**'
      - 'Directory.Packages.props'
      - '.github/workflows/profiler.yml'
  pull_request:
    paths:
      - 'src/AddIns/Analysis/Profiler/Core/**'
      - 'tests/OpenDevelop.Profiler.Tests/**'
      - 'tests/fixtures/ProfilerFixture/**'
      - 'Directory.Packages.props'
      - '.github/workflows/profiler.yml'
  workflow_dispatch:

# Profiling runs are tied to a commit, so an older in-flight matrix has no value after a newer push.
concurrency:
  group: profiler-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps its version from git history (GitVersion).
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run the Profiler tests
        run: dotnet run --project tests/OpenDevelop.Profiler.Tests --configuration Release
