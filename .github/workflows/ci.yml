name: CI

# One workflow for the local test suites that .github/ci/test-plan.json has switched on.
#
#   plan       -> reads the plan and emits the job matrices
#   build      -> per platform, compiles everything the enabled archive lanes need exactly once, uploads the workspace
#   test       -> per (platform, job): once the platform's build is done, unpacks its archive and runs the lanes of the job one
#                 after another. The quick lanes (unit, integration-stable, integration-unstable) share the 'fast' job, so the
#                 archive is downloaded once for them; the long designer lane is its own job and runs in parallel. A
#                 'buildFrom' platform (Windows ARM64) unpacks its provider's archive, because that build is what it ships.
#
# Every platform the release ships (test-plan.json 'platforms': Windows x64 and ARM64, macOS ARM64, Linux x64 and ARM64)
# gets the same three layers here: a Debug build, the unit suites and the IDE journeys. This is the Debug build with tests
# and debug information; Release builds and packaging belong to release.yml alone.
#
# Jobs run in parallel, each on its own fresh machine, so they cannot interfere through ports, config directories
# or temp files; the lanes of a job and the entries inside a lane run one after another.  What runs is decided by the plan, not by this file:
# enabling more tests is a reviewed edit of the plan (a new batch starts as 'observe').  The Profiler tests and the
# Terminal journey are plan entries now; their own workflows are gone.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'images/**'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'images/**'
  workflow_dispatch:
    inputs:
      through_batch:
        description: Run plan entries up to this batch (empty = the plan's throughBatch).
        required: false
        default: ''
      full:
        description: Also run the 'required' entries that the plan's "focus" mode skips.
        required: false
        type: boolean
        default: false
      platforms:
        description: Run only these platforms, comma separated (for example windows-x64,windows-arm64; empty = all). Use it when a platform's runners are unavailable, because the lanes wait for the whole build matrix.
        required: false
        default: ''

permissions:
  contents: read
  # LibreWPF, LibreWinForms and ProGPU are restored from OpenAvalon's packages in this organization.
  packages: read
  # dorny/test-reporter publishes the TRX results as annotations; fork PRs get a read-only token and the step is
  # continue-on-error, so this costs nothing there.
  checks: write

# A newer pull request run supersedes an older one.  Master runs are not cancelled: a 40-minute run that is thrown away
# by the next push never produced a result anyone could read.
concurrency:
  # The event name is part of the group so a manual dispatch can run beside a push instead of being folded into it
  # (a workflow_dispatch queued behind a push in the same group is cancelled, which is how the first diagnostic run died).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Read by .github/ci/run-statuses.ps1: with the plan in focus mode, 'true' runs the 'required' entries as well.
  OD_CI_FULL: ${{ inputs.full && 'true' || 'false' }}
  # The global packages folder: the build job restores into it, packs it, and the lanes that start the IDE unpack it.
  NUGET_CACHE_PATH: ${{ github.workspace }}/artifacts/nuget-packages
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
  # NuGet consumes this conventional variable without writing the ephemeral token into NuGet.config,
  # the package cache key, or the workspace archive.
  NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      lane_matrix: ${{ steps.matrix.outputs.lane_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The device-journey guard below reads the integration test sources to find the classes that need a device.
          sparse-checkout: |
            .github/ci
            tests/OpenDevelop.IntegrationTests
      - name: Verify shared build selection
        shell: pwsh
        run: ./.github/ci/tests/build-selection.ps1
      - name: Verify Windows GTK validation
        shell: pwsh
        run: ./.github/ci/tests/verify-gtk-windows.ps1
      - name: Verify the plan runs no emulator or simulator journeys
        shell: pwsh
        run: ./.github/ci/tests/verify-no-device-journeys.ps1
      - id: matrix
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/plan-matrix.ps1 -ThroughBatch $through -Platforms $env:PLATFORMS

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamps its version from git history (GitVersion).
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - name: Reclaim disk space on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/ci/install-linux-prerequisites.sh --reclaim-disk
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Compile everything the enabled entries need, once
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/build-binaries.ps1 -Platform '${{ matrix.name }}' -ThroughBatch $through
      - name: Verify the Android debug agents
        shell: pwsh
        run: |
          # A narrowed build (through_batch/platforms) may never compile the debugger add-in, so
          # restore it explicitly: the check is about the pinned package, not about the entries that
          # happened to run. Then verify both the package payload and the copy the add-in deployed.
          dotnet restore src/AddIns/Debugger/Debugger.AddIn/Debugger.AddIn.csproj
          ./build/verify-android-debug-agent.ps1
          if (Test-Path 'AddIns/Debugger/android') { ./build/verify-android-debug-agent.ps1 -AgentRoot 'AddIns/Debugger/android' }
      - name: Verify complete native Terminal package closure
        # The GitHub Packages fork is a single, version-locked cross-platform contract. Verify
        # the five supported RIDs on every native platform build; a Linux asset omission must not wait
        # until the first Linux release job to become visible.
        if: matrix.name == 'windows-x64' || matrix.name == 'windows-arm64' || matrix.name == 'macos-arm64' || matrix.name == 'linux-x64' || matrix.name == 'linux-arm64'
        shell: pwsh
        run: ./.github/ci/verify-terminal-assets.ps1 -Platform '${{ matrix.name }}'
      # One Windows payload serves x64 and ARM64: fail here if any IL-only assembly was built for one architecture.
      # Linux is skipped here only because its contract (no foreign linux-* RID tree) holds for the trimmed archive, not
      # for the RID-less Debug tree: its lanes run the same check, payload included, after unpacking.
      - name: Verify payload bitness
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./.github/ci/verify-bitness.ps1 -Platform '${{ matrix.name }}' -PayloadOnly
      - name: Pack the workspace
        shell: pwsh
        run: ./.github/ci/package-workspace.ps1 -Platform '${{ matrix.name }}' -Directory '${{ runner.temp }}/archive'
      - uses: actions/upload-artifact@v7
        with:
          name: workspace-${{ matrix.name }}
          path: ${{ runner.temp }}/archive/
          # The archive is compressed already; a second pass only costs time.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # The IDE host is not self-contained: at run time it resolves the LibreWPF assemblies from the global packages
      # folder, so the lanes that start the IDE need it. It travels as an artifact (one tar.zst, like the workspace), not
      # as an actions/cache entry: the repository's cache is capped at 10 GB and the four per-platform entries (3.4-4.3 GB
      # each) could not coexist, so GitHub evicted one while the jobs that needed it were still queued (run 41457885169).
      - name: Pack the NuGet package folder
        shell: pwsh
        run: ./.github/ci/package-workspace.ps1 -Platform '${{ matrix.name }}' -Kind NuGetCache -Directory '${{ runner.temp }}/nuget-archive'
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.name }}
          path: ${{ runner.temp }}/nuget-archive/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.job }} (${{ matrix.platform }})
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lane_matrix) }}
    steps:
      # Only the scripts: the archive carries the rest, including this same .github/ci.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
      - uses: actions/download-artifact@v8
        with:
          # The archive of the packaging unit this lane belongs to: Windows x64 and ARM64 share one build.
          name: workspace-${{ matrix.build_platform }}
          path: ${{ runner.temp }}/archive
      - name: Unpack the workspace built by the build job
        shell: pwsh
        run: ./.github/ci/package-workspace.ps1 -Extract -Directory '${{ runner.temp }}/archive'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Install macOS native input helper
        if: matrix.needs_cliclick && matrix.job != 'mobile-ios'
        shell: bash
        run: brew install cliclick
      # Attaching a debugger needs task_for_pid, which macOS authorizes through the
      # system.privilege.taskport right. With nobody to answer that prompt on the runner,
      # ICorDebug attach blocks forever; grant the right up front.
      - name: Allow debugger attach on macOS
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          sudo DevToolsSecurity -enable
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo security authorizationdb write system.privilege.taskport allow
      # Read-only report for the macOS pointer journeys (Terminal pad, designer drags): every one of them fails
      # with no pointer event reaching the IDE (events: []). Record what the VM looks like for native input: the
      # frontmost application (loginwindow in front is the macOS counterpart of the Windows first-logon page),
      # whether the session is locked, what cliclick can do from this shell, and which input permissions are
      # granted, plus a desktop screenshot in the uploaded test-log directory. It changes nothing.
      - name: Report macOS native input readiness
        if: matrix.platform == 'macos-arm64' && matrix.job != 'mobile-ios'
        continue-on-error: true
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/macos-report-input.sh"
      # Read-only probe for the macOS pointer journeys. TCC allows the IDE's cliclick helper (the unified log shows
      # Auth:Allowed for PostEvent and Accessibility, no denial), the desktop is Finder with the screen unlocked, and
      # cliclick moves the cursor from a shell, yet every test that sends a real click sees no mouse-down. Show one
      # small Cocoa window, click its centre with cliclick, and report whether the mouse-down reached it. It answers
      # whether an OS-level click can reach any application on this VM at all, independent of the IDE.
      - name: Probe macOS click delivery
        if: matrix.platform == 'macos-arm64' && matrix.job != 'mobile-ios'
        continue-on-error: true
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/macos-probe-click.sh"
      # The click probe above shows an OS-level click does reach a Cocoa window on this VM, so the failing pointer
      # journeys miss for a reason specific to the IDE window. The VM display is 1024x768 with a menu bar and a Dock,
      # and the IDE window is 1024x768 placed at (10,10): macOS moves and shrinks a titled window to fit under the menu
      # bar, while the geometry WPF reports (and the click points derived from it) stays 1024x768 at (10,10). Sample the
      # real window-server geometry during the lane, with a screenshot every 30 seconds, so the failing drags can be
      # compared with it. Read-only; the loop ends with the job.
      - name: Sample the macOS desktop during the lane
        if: matrix.platform == 'macos-arm64' && matrix.job != 'mobile-ios'
        continue-on-error: true
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/ci/macos-sample-desktop.sh"
      # The ARM64 lane runs the output of the Windows x64 build job. Its PDBs carry that runner's workspace
      # path (D:\a\<repo>\<repo>), while this runner's workspace is C:\a\<repo>\<repo>. The debugger reports
      # the PDB path, so the IDE could not open the stop location (log: "Can't load file Program.cs under
      # D:\a\...") and the console completion found no file to analyse. Make the build job's path resolve to
      # this workspace: map the missing D: drive, or junction D:\a when the drive exists without it.
      - name: Map the build job's workspace path
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        shell: pwsh
        run: |
          $workspaceDrive = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          $built = 'D:' + $env:GITHUB_WORKSPACE.Substring($workspaceDrive.Length)
          "workspace = $env:GITHUB_WORKSPACE, build job's path = $built, D: exists = $(Test-Path 'D:\')"
          if ($workspaceDrive -ne 'D:' -and -not (Test-Path $built)) {
            if (-not (Test-Path 'D:\')) { subst D: "$workspaceDrive\" }
            elseif (-not (Test-Path 'D:\a')) { New-Item -ItemType Junction -Path 'D:\a' -Target "$workspaceDrive\a" | Out-Null }
          }
          if (Test-Path $built) { "$built resolves" } else { Write-Warning "$built does not resolve; debugger source paths from the build job will not open" }
      # Ported from lextudio/AvalonDock (branch opendevelop, .github/workflows/ci-librewpf.yml). The pointer
      # journeys click the real desktop, so it has to look like one. windows-11-arm logs in to the Windows
      # first-logon privacy page ("Choose privacy settings for your device"), a full-screen window above
      # everything: od.activate could never make the IDE the foreground window (foregrounded=false) and
      # every real click landed on that page. The step dismisses it and the Start menu it leaves open,
      # minimises leftover windows (the agent console), starts a watchdog that keeps the wsl.exe terminal
      # windows the image keeps opening out of the foreground, keeps full-window dragging on, and saves
      # desktop screenshots into the uploaded test-log directory.
      - name: Prepare the Windows desktop
        if: runner.os == 'Windows'
        # Best effort: a failure here must not turn a required lane red; the tests then show what is left.
        continue-on-error: true
        shell: pwsh
        run: |
          ./.github/ci/prepare-windows-desktop.ps1

      - name: Install Linux display and native runtime prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/ci/install-linux-prerequisites.sh --display
      - name: Install GTK designer runtimes and metadata
        if: matrix.needs_gtk && matrix.platform == 'macos-arm64'
        shell: bash
        run: brew install gtk4 libadwaita
      - name: Install Windows GTK designer runtimes and metadata
        id: gtk-msys
        if: matrix.needs_gtk && (matrix.platform == 'windows-x64' || matrix.platform == 'windows-arm64')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.platform == 'windows-arm64' && 'CLANGARM64' || 'UCRT64' }}
          # The freshly extracted release has an older keyring on Windows ARM64, which rejects
          # current package signatures. The hosted ARM64 image's maintained installation is at
          # C:/msys64; retain the fresh-release path that already works for Windows x64.
          release: ${{ matrix.platform != 'windows-arm64' }}
          location: C:/msys64
          update: true
          install: ${{ matrix.platform == 'windows-arm64' && 'mingw-w64-clang-aarch64-gtk4 mingw-w64-clang-aarch64-libadwaita' || 'mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita' }}
      - name: Verify Windows GTK runtime and metadata
        if: matrix.needs_gtk && (matrix.platform == 'windows-x64' || matrix.platform == 'windows-arm64')
        shell: pwsh
        env:
          GTK_MSYS_ROOT: ${{ steps.gtk-msys.outputs.msys2-location }}
          GTK_PLATFORM: ${{ matrix.platform }}
        run: |
          ./.github/ci/verify-gtk-windows.ps1
          $environment = if ($env:GTK_PLATFORM -eq 'windows-arm64') { 'clangarm64' } else { 'ucrt64' }
          "GTK4_ROOT=$(Join-Path $env:GTK_MSYS_ROOT $environment)" | Add-Content -Path $env:GITHUB_ENV
      # The package folder the build job packed, for the lanes that start the IDE. Named by the platform whose build job
      # produced it, not by this runner: the Windows ARM64 lane runs the windows-x64 build ('buildFrom').
      - name: Download the NuGet package folder
        if: matrix.needs_nuget_cache
        uses: actions/download-artifact@v8
        with:
          name: nuget-${{ matrix.build_platform }}
          path: ${{ runner.temp }}/nuget-archive
      - name: Unpack the NuGet package folder
        if: matrix.needs_nuget_cache
        shell: pwsh
        run: ./.github/ci/package-workspace.ps1 -Extract -Kind NuGetCache -Directory '${{ runner.temp }}/nuget-archive'
      - name: Verify native Terminal package assets
        if: matrix.needs_nuget_cache
        shell: pwsh
        run: ./.github/ci/verify-terminal-assets.ps1 -Platform '${{ matrix.platform }}'
      # The device lanes. Each runs on the one runner image family that can host its device: an iOS Simulator is a
      # native macOS process, and the Android emulator needs KVM, which only the hosted Linux x86_64 runners provide
      # (macOS arm64 and ubuntu-24.04-arm have no nested virtualisation). The plan declares which lane may run which
      # device class, and verify-no-device-journeys.ps1 fails the plan when a lane's runner cannot host it.
      - name: Enable KVM for the Android emulator
        if: matrix.job == 'mobile-android'
        shell: bash
        run: |
          # The image ships /dev/kvm as root-only; this udev rule makes it usable by the job. Fail here, not after the
          # journey has already fallen back to software emulation and timed out.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo '::error::/dev/kvm is not readable and writable; this runner cannot accelerate an Android emulator.'
            exit 1
          fi
      - uses: actions/setup-java@v6
        if: matrix.job == 'mobile-android'
        with:
          distribution: temurin
          java-version: '17'
      # The journeys build net11.0-android / net11.0-ios fixtures, so they need an SDK 11 and its workloads beside the
      # SDK 10 this job runs the archive on. Install it into ~/.dotnet instead of the job's own root and leave PATH
      # alone: SdkRootCandidates.WithSdk11 finds that folder and the journeys register it with od.sdk.add-custom-root
      # (the same opt-in as Tools > Options > .NET SDK), while the archive's net10.0 test host keeps its runtime.
      - name: Install the .NET 11 SDK for the device journeys
        if: matrix.job == 'mobile-android' || matrix.needs_ios_simulator
        shell: bash
        env:
          WORKLOAD: ${{ matrix.job == 'mobile-android' && 'android' || 'ios' }}
        run: |
          set -euo pipefail
          root="$HOME/.dotnet"
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 11.0 --install-dir "$root" --no-path
          "$root/dotnet" --list-sdks
          sdk=$("$root/dotnet" --list-sdks | awk '$1 ~ /^11\./ { print $1 }' | sort -V | tail -n 1)
          test -n "$sdk"
          # The SDK's workload set, not its bundled manifest: the rc.3 bundled manifest misses packs,
          # and --skip-manifest-update keeps it.
          work="$RUNNER_TEMP/workload"
          mkdir -p "$work"
          printf '{"sdk":{"version":"%s","allowPrerelease":true,"rollForward":"disable"}}\n' "$sdk" > "$work/global.json"
          ( cd "$work" && DOTNET_ROOT="$root" "$root/dotnet" workload install "$WORKLOAD" )
      - name: Install and boot an Android emulator
        if: matrix.job == 'mobile-android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          adb="$ANDROID_HOME/platform-tools/adb"
          yes | "$sdkmanager" --licenses > /dev/null || true
          # android-35 x86_64 google_apis is the image whose ABI the archive's AddIns/Debugger/android/x86_64 agent and
          # the fixture's SupportedOSPlatformVersion (24) match. sdkmanager only downloads what the image lacks.
          "$sdkmanager" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$avdmanager" create avd -n opendevelop-ci -k 'system-images;android-35;google_apis;x86_64' -d pixel_6 --force
          acceleration=$("$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 || true)
          echo "$acceleration"
          if ! grep -qi 'is installed and usable' <<< "$acceleration"; then
            echo '::error::The Android emulator cannot use KVM on this runner.'
            exit 1
          fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd opendevelop-ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          if ! timeout 300 "$adb" wait-for-device; then
            tail -n 50 "$RUNNER_TEMP/emulator.log"
            echo '::error::The Android emulator never reached adb within 5 minutes.'
            exit 1
          fi
          for attempt in $(seq 1 150); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
            sleep 2
          done
          "$adb" devices
          if [ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" != '1' ]; then
            tail -n 50 "$RUNNER_TEMP/emulator.log"
            echo '::error::The Android emulator did not finish booting.'
            exit 1
          fi
      - name: Boot an iPhone simulator
        if: matrix.needs_ios_simulator
        shell: bash
        run: |
          set -euo pipefail
          # The image ships Xcode 27.0 beside its 27.1 default (/Applications/Xcode_27.app), and the .NET 11 iOS
          # workload pack (27.0.12212-net11-rc.2) requires exactly that 27.0 SDK, which Xcode 27.1 is not. Select
          # it for the whole machine here - the IDE's build in the lane resolves Xcode through xcrun.
          sudo xcode-select -s /Applications/Xcode_27.app
          # The .NET 11 iOS workload set pins Microsoft.NET.Sdk.iOS 27.0.12212-net11-rc.2, which needs Xcode 27.
          xcodebuild -version
          # The journey installs and launches through simctl, and the IDE picks a booted iPhone first, so booting one
          # here keeps the choice unambiguous on an image that carries several runtimes.
          udid=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -n 1 | grep -oE '[0-9a-fA-F-]{36}')
          if [ -z "$udid" ]; then
            echo '::error::No iPhone simulator is available on this runner.'
            exit 1
          fi
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted
      # The lane must run the architecture its platform promises, against the payload that carries those assets.
      - name: Verify the lane's bitness
        shell: pwsh
        run: ./.github/ci/verify-bitness.ps1 -Platform '${{ matrix.platform }}'
      - name: Run the lane
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
          # The IDE start-up log of every test launch lands here; it is uploaded below.
          OD_TEST_LOG_DIR: ${{ runner.temp }}/od-test-logs
          OD_TEST_KEEP_ARTIFACTS: '1'
          OD_TEST_RESULTS: TestResults
          MSYS2_ROOT: ${{ steps.gtk-msys.outputs.msys2-location }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          # The lanes of this job run one after another on the one unpacked archive; a failing lane does not stop the next,
          # and the step fails when any of them did.
          $failed = @()
          foreach ($lane in '${{ join(matrix.lanes, ' ') }}' -split ' ') {
              try {
                  ./.github/ci/run-test-plan.ps1 -Platform '${{ matrix.platform }}' -Lane $lane -ThroughBatch $through
              } catch {
                  # run-test-plan.ps1 throws instead of exiting when the plan or its own state is wrong; that must cost
                  # only this lane.
                  Write-Host "::error title=$lane::$($_.Exception.Message)"
                  $global:LASTEXITCODE = 1
              }
              if ($LASTEXITCODE -ne 0) { $failed += $lane }
          }
          if ($failed.Count -gt 0) { Write-Host "::error::Failed lanes: $($failed -join ', ')"; exit 1 }
      # Read-only, after the lane: the pointer journeys inject clicks through cliclick, started by the IDE under
      # this job's process chain, so macOS decides input permission for that chain, not for the step shell the
      # readiness report ran in. The unified log records each decision; keep the input-related ones in the
      # uploaded test-log directory and print the denials and the clients that were asked.
      - name: Report macOS input permission decisions
        if: always() && matrix.platform == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/od-test-logs"
          log_file="$RUNNER_TEMP/od-test-logs/macos-tcc.log"
          sudo log show --last 3h --info --debug --style compact --predicate 'subsystem == "com.apple.TCC" AND (eventMessage CONTAINS "kTCCServicePostEvent" OR eventMessage CONTAINS "kTCCServiceAccessibility" OR eventMessage CONTAINS "kTCCServiceListenEvent")' > "$log_file" 2>&1 || true
          echo "TCC input decisions logged: $(wc -l < "$log_file")"
          grep -iE "den(y|ied)|cliclick|dotnet|OpenDevelop|pwsh" "$log_file" | cut -c1-320 | sort | uniq -c | sort -rn | head -40
      - name: Publish the test results as a check
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v3
        with:
          name: ${{ matrix.job }} (${{ matrix.platform }})
          path: TestResults/*.trx
          reporter: dotnet-trx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.job }}-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.job }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/od-test-logs
          if-no-files-found: ignore
          retention-days: 3

  # What release.yml's gate looks for. A green run is not enough: with the plan in focus mode the 'required' entries are
  # skipped, and a dispatch narrowed by 'through_batch' or 'platforms' runs a subset. Only a run that executed the full plan
  # on this commit uploads the 'release-grade' artifact. This workflow is the Debug build with tests and debug information;
  # Release builds and packaging belong to release.yml alone.
  release-grade:
    name: Release grade
    needs: [plan, build, test]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
      - name: Decide whether this run can gate a release
        shell: pwsh
        env:
          NEEDS: ${{ toJSON(needs) }}
          NARROWED: ${{ (inputs.through_batch || inputs.platforms) && 'true' || 'false' }}
        run: ./.github/ci/release-grade.ps1 -Output release-grade.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-grade
          path: release-grade.txt
          if-no-files-found: ignore
          retention-days: 90
