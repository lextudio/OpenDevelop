name: CI

# One workflow for the local test suites that .github/ci/test-plan.json has switched on.
#
#   plan       -> reads the plan and emits the job matrices (and the one lane that builds in place)
#   build      -> per platform, compiles everything the enabled archive lanes need exactly once, uploads the workspace
#   test       -> per (platform, lane) that consumes that archive, unpacks it and runs the lane's assemblies
#   in-place   -> the one lane whose definition says 'buildsInLane': its own checkout, no archive, so it reports
#                 early instead of waiting for the platform build
#
# Lanes run in parallel, each on its own fresh machine, so they cannot interfere through ports, config directories
# or temp files; the entries inside a lane run one after another.  What runs is decided by the plan, not by this file:
# enabling more tests is a reviewed edit of the plan (a new batch starts as 'observe').  The Profiler tests and the
# Terminal journey are plan entries now; their own workflows are gone.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'images/**'
      - 'build/macos/**'
  pull_request:
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'images/**'
      - 'build/macos/**'
  workflow_dispatch:
    inputs:
      through_batch:
        description: Run plan entries up to this batch (empty = the plan's throughBatch).
        required: false
        default: ''
      diagnose:
        description: Run the temporary IDE host diagnostics (build and test jobs).
        required: false
        type: boolean
        default: false
      full:
        description: Also run the 'required' entries that the plan's "focus" mode skips.
        required: false
        type: boolean
        default: false
      platforms:
        description: Run only these platforms, comma separated (for example windows-x64,windows-arm64; empty = all). Use it when a platform's runners are unavailable, because the lanes wait for the whole build matrix.
        required: false
        default: ''

permissions:
  contents: read
  # LibreWPF, LibreWinForms and ProGPU are restored from OpenAvalon's packages in this organization.
  packages: read
  # dorny/test-reporter publishes the TRX results as annotations; fork PRs get a read-only token and the step is
  # continue-on-error, so this costs nothing there.
  checks: write

# A newer pull request run supersedes an older one.  Master runs are not cancelled: a 40-minute run that is thrown away
# by the next push never produced a result anyone could read.
concurrency:
  # The event name is part of the group so a manual 'diagnose' run can run beside a push instead of being folded into it
  # (a workflow_dispatch queued behind a push in the same group is cancelled, which is how the first diagnostic run died).
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Read by .github/ci/run-statuses.ps1: with the plan in focus mode, 'true' runs the 'required' entries as well.
  OD_CI_FULL: ${{ inputs.full && 'true' || 'false' }}
  # The cache steps name this folder relatively (artifacts/nuget-packages): actions/cache hashes the path text into the
  # entry's version, and the workspace is D:\a\... on the x64 runner but C:\a\... on the ARM64 one, so an absolute path
  # made the ARM64 lane miss the entry the x64 build saved under the very same key.
  NUGET_CACHE_PATH: ${{ github.workspace }}/artifacts/nuget-packages
  NUGET_PACKAGES: ${{ github.workspace }}/artifacts/nuget-packages
  # NuGet consumes this conventional variable without writing the ephemeral token into NuGet.config,
  # the package cache key, or the workspace archive.
  NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      lane_matrix: ${{ steps.matrix.outputs.lane_matrix }}
      has_in_lane: ${{ steps.matrix.outputs.has_in_lane }}
      in_lane_name: ${{ steps.matrix.outputs.in_lane_name }}
      in_lane_platform: ${{ steps.matrix.outputs.in_lane_platform }}
      in_lane_runner: ${{ steps.matrix.outputs.in_lane_runner }}
      in_lane_architecture: ${{ steps.matrix.outputs.in_lane_architecture }}
      in_lane_timeout: ${{ steps.matrix.outputs.in_lane_timeout }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
      - name: Verify shared build selection
        shell: pwsh
        run: ./.github/ci/tests/build-selection.ps1
      - name: Verify Windows GTK validation
        shell: pwsh
        run: ./.github/ci/tests/verify-gtk-windows.ps1
      - id: matrix
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/plan-matrix.ps1 -ThroughBatch $through -Platforms $env:PLATFORMS

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build_matrix) }}
    # The IDE lanes restore the same cache entry, so the key is computed once here and handed to them.
    outputs:
      nuget_cache_key: ${{ steps.nuget-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps its version from git history (GitVersion).
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - id: nuget-key
        name: Compute the package cache key
        shell: pwsh
        run: |
          $key = "nuget-${{ matrix.name }}-${{ inputs.through_batch || 'default' }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'NuGet.config', '.github/ci/test-plan.json', 'tests/fixtures/**/*.csproj') }}"
          Write-Host "cache key: $key"
          "key=$key" | Add-Content -Path $env:GITHUB_OUTPUT
      # The package folder is the same cache entry the IDE lanes restore: restoring it here is what makes the
      # compile cheap, and saving it once per key keeps those lanes from re-resolving every package.
      - name: Restore the NuGet package cache
        uses: actions/cache@v4
        with:
          path: artifacts/nuget-packages
          key: ${{ steps.nuget-key.outputs.key }}
      - name: Compile everything the enabled entries need, once
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/build-binaries.ps1 -Platform '${{ matrix.name }}' -ArchiveLanesOnly -ThroughBatch $through
      - name: Verify complete native Terminal package closure
        # The GitHub Packages fork is a single, version-locked cross-platform contract. Verify
        # the five supported RIDs on every native platform build; a Linux asset omission must not wait
        # until the first Linux release job to become visible.
        if: matrix.name == 'windows-x64' || matrix.name == 'windows-arm64' || matrix.name == 'macos-arm64' || matrix.name == 'linux-x64' || matrix.name == 'linux-arm64'
        shell: pwsh
        run: ./.github/ci/verify-terminal-assets.ps1 -Platform '${{ matrix.name }}'
      # One Windows payload serves x64 and ARM64: fail here if any IL-only assembly was built for one architecture.
      - name: Verify payload bitness
        shell: pwsh
        run: ./.github/ci/verify-bitness.ps1 -Platform '${{ matrix.name }}' -PayloadOnly
      # TEMPORARY: starts the host right after compiling, before it is archived, to tell a build-output problem from an
      # archive/extract problem. Run it with the 'diagnose' input; remove it with the matching test-job step.
      - name: Diagnose the freshly built IDE host (before packing)
        if: inputs.diagnose
        shell: pwsh
        run: ./.github/ci/diagnose-host.ps1
      - name: Pack the workspace
        shell: pwsh
        run: ./.github/ci/package-workspace.ps1 -Platform '${{ matrix.name }}' -Directory '${{ runner.temp }}/archive'
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.name }}
          path: ${{ runner.temp }}/archive/
          # The archive is compressed already; a second pass only costs time.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test:
    name: ${{ matrix.lane }} (${{ matrix.platform }})
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.lane_matrix) }}
    steps:
      # Only the scripts: the archive carries the rest, including this same .github/ci.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ci
      - uses: actions/download-artifact@v4
        with:
          # The archive of the packaging unit this lane belongs to: Windows x64 and ARM64 share one build.
          name: workspace-${{ matrix.build_platform }}
          path: ${{ runner.temp }}/archive
      - name: Unpack the workspace built by the build job
        shell: pwsh
        run: ./.github/ci/package-workspace.ps1 -Extract -Directory '${{ runner.temp }}/archive'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Install macOS native input helper
        if: matrix.needs_cliclick
        shell: bash
        run: brew install cliclick
      # Attaching a debugger needs task_for_pid, which macOS authorizes through the
      # system.privilege.taskport right. With nobody to answer that prompt on the runner,
      # ICorDebug attach blocks forever; grant the right up front.
      - name: Allow debugger attach on macOS
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          sudo DevToolsSecurity -enable
          sudo dseditgroup -o edit -a "$USER" -t user _developer
          sudo security authorizationdb write system.privilege.taskport allow
      # Read-only report for the macOS pointer journeys (Terminal pad, designer drags): every one of them fails
      # with no pointer event reaching the IDE (events: []). Record what the VM looks like for native input: the
      # frontmost application (loginwindow in front is the macOS counterpart of the Windows first-logon page),
      # whether the session is locked, what cliclick can do from this shell, and which input permissions are
      # granted, plus a desktop screenshot in the uploaded test-log directory. It changes nothing.
      - name: Report macOS native input readiness
        if: matrix.platform == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/od-test-logs"
          echo "user=$(id -un) console=$(stat -f %Su /dev/console)"; who || true
          echo "frontmost: $(lsappinfo front 2>&1 | head -1) $(lsappinfo info -only name "$(lsappinfo front)" 2>&1 | head -1)"
          echo "screen locked flag: $(ioreg -n Root -d1 -w0 2>/dev/null | grep -o 'CGSSessionScreenIsLocked[^,]*' | head -1)"
          echo "cliclick position: $(cliclick p 2>&1)"
          cliclick m:200,200 2>&1 || true; sleep 0.5
          echo "cliclick position after m:200,200: $(cliclick p 2>&1)"
          echo "System Events: $(osascript -e 'tell application "System Events" to count processes' 2>&1 | head -2)"
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "== $db"
            sudo sqlite3 "$db" "select service, client, auth_value from access where service in ('kTCCServiceAccessibility','kTCCServicePostEvent','kTCCServiceListenEvent','kTCCServiceScreenCapture')" 2>&1 | head -40
          done
          echo "SIP: $(csrutil status 2>&1)"
          screencapture -x "$RUNNER_TEMP/od-test-logs/macos-desktop.png" 2>&1 || true
      # Read-only probe for the macOS pointer journeys. TCC allows the IDE's cliclick helper (the unified log shows
      # Auth:Allowed for PostEvent and Accessibility, no denial), the desktop is Finder with the screen unlocked, and
      # cliclick moves the cursor from a shell, yet every test that sends a real click sees no mouse-down. Show one
      # small Cocoa window, click its centre with cliclick, and report whether the mouse-down reached it. It answers
      # whether an OS-level click can reach any application on this VM at all, independent of the IDE.
      - name: Probe macOS click delivery
        if: matrix.platform == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/od-test-logs"
          swiftc -o "$RUNNER_TEMP/click-probe" "$GITHUB_WORKSPACE/.github/ci/macos-click-probe.swift"
          log="$RUNNER_TEMP/od-test-logs/click-probe.log"
          "$RUNNER_TEMP/click-probe" > "$log" 2>&1 &
          probe=$!
          for _ in $(seq 1 60); do grep -q READY "$log" && break; sleep 0.5; done
          cat "$log"
          read -r _ x y _ < <(grep -m1 READY "$log" || echo "READY 400 400")
          echo "frontmost: $(lsappinfo info -only name "$(lsappinfo front)" 2>&1 | head -1)"
          screencapture -x "$RUNNER_TEMP/od-test-logs/click-probe-before.png" 2>&1 || true
          for attempt in "c:$x,$y" "m:$x,$y dd:$x,$y du:$x,$y"; do
            grep -q DOWN "$log" && break
            echo "cliclick $attempt"; cliclick $attempt 2>&1 || true
            for _ in $(seq 1 12); do grep -q DOWN "$log" && break; sleep 0.25; done
          done
          screencapture -x "$RUNNER_TEMP/od-test-logs/click-probe-after.png" 2>&1 || true
          cat "$log"
          grep -q DOWN "$log" && echo "RESULT: the click reached the probe window" || echo "RESULT: NO mouse-down reached the probe window"
          kill "$probe" 2>/dev/null || true
      # The click probe above shows an OS-level click does reach a Cocoa window on this VM, so the failing pointer
      # journeys miss for a reason specific to the IDE window. The VM display is 1024x768 with a menu bar and a Dock,
      # and the IDE window is 1024x768 placed at (10,10): macOS moves and shrinks a titled window to fit under the menu
      # bar, while the geometry WPF reports (and the click points derived from it) stays 1024x768 at (10,10). Sample the
      # real window-server geometry during the lane, with a screenshot every 30 seconds, so the failing drags can be
      # compared with it. Read-only; the loop ends with the job.
      - name: Sample the macOS desktop during the lane
        if: matrix.platform == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/od-test-logs"
          swiftc -o "$RUNNER_TEMP/window-list" "$GITHUB_WORKSPACE/.github/ci/macos-window-list.swift"
          nohup bash -c 'n=0; while true; do { echo "== $(date +%H:%M:%S)"; "$0"; } >> "$1"; if [ $((n % 3)) -eq 0 ]; then screencapture -x "$2/macos-$(date +%H%M%S).png"; fi; n=$((n + 1)); sleep 10; done' "$RUNNER_TEMP/window-list" "$RUNNER_TEMP/od-test-logs/macos-windows.log" "$RUNNER_TEMP/od-test-logs" > /dev/null 2>&1 &
          disown
          sleep 2
          cat "$RUNNER_TEMP/od-test-logs/macos-windows.log"
      # The ARM64 lane runs the output of the Windows x64 build job. Its PDBs carry that runner's workspace
      # path (D:\a\<repo>\<repo>), while this runner's workspace is C:\a\<repo>\<repo>. The debugger reports
      # the PDB path, so the IDE could not open the stop location (log: "Can't load file Program.cs under
      # D:\a\...") and the console completion found no file to analyse. Make the build job's path resolve to
      # this workspace: map the missing D: drive, or junction D:\a when the drive exists without it.
      - name: Map the build job's workspace path
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        shell: pwsh
        run: |
          $workspaceDrive = Split-Path $env:GITHUB_WORKSPACE -Qualifier
          $built = 'D:' + $env:GITHUB_WORKSPACE.Substring($workspaceDrive.Length)
          "workspace = $env:GITHUB_WORKSPACE, build job's path = $built, D: exists = $(Test-Path 'D:\')"
          if ($workspaceDrive -ne 'D:' -and -not (Test-Path $built)) {
            if (-not (Test-Path 'D:\')) { subst D: "$workspaceDrive\" }
            elseif (-not (Test-Path 'D:\a')) { New-Item -ItemType Junction -Path 'D:\a' -Target "$workspaceDrive\a" | Out-Null }
          }
          if (Test-Path $built) { "$built resolves" } else { Write-Warning "$built does not resolve; debugger source paths from the build job will not open" }
      # Ported from lextudio/AvalonDock (branch opendevelop, .github/workflows/ci-librewpf.yml). The pointer
      # journeys click the real desktop, so it has to look like one. windows-11-arm logs in to the Windows
      # first-logon privacy page ("Choose privacy settings for your device"), a full-screen window above
      # everything: od.activate could never make the IDE the foreground window (foregrounded=false) and
      # every real click landed on that page. The step dismisses it and the Start menu it leaves open,
      # minimises leftover windows (the agent console), starts a watchdog that keeps the wsl.exe terminal
      # windows the image keeps opening out of the foreground, keeps full-window dragging on, and saves
      # desktop screenshots into the uploaded test-log directory.
      - name: Prepare the Windows desktop
        if: runner.os == 'Windows'
        # Best effort: a failure here must not turn a required lane red; the tests then show what is left.
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -Namespace Native -Name Desk -MemberDefinition @'
          public delegate bool EnumProc(System.IntPtr hwnd, System.IntPtr lParam);
          [System.Runtime.InteropServices.StructLayout(System.Runtime.InteropServices.LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc proc, System.IntPtr lParam);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool IsWindowVisible(System.IntPtr hwnd);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool GetWindowRect(System.IntPtr hwnd, out RECT r);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(System.IntPtr hwnd, out uint pid);
          [System.Runtime.InteropServices.DllImport("user32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern int GetClassName(System.IntPtr hwnd, System.Text.StringBuilder s, int n);
          [System.Runtime.InteropServices.DllImport("user32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern int GetWindowText(System.IntPtr hwnd, System.Text.StringBuilder s, int n);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr hwnd, int cmd);
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern uint GetDpiForSystem();
          [System.Runtime.InteropServices.DllImport("user32.dll")] public static extern int GetSystemMetrics(int i);
          [System.Runtime.InteropServices.DllImport("user32.dll", SetLastError = true)] public static extern bool SystemParametersInfo(uint action, uint param, ref int value, uint winIni);
          [System.Runtime.InteropServices.DllImport("user32.dll", SetLastError = true)] public static extern bool SystemParametersInfo(uint action, uint param, System.IntPtr value, uint winIni);
          '@
          function Get-TopWindows {
            $list = New-Object System.Collections.Generic.List[object]
            [void][Native.Desk]::EnumWindows({ param($h, $l)
              if ([Native.Desk]::IsWindowVisible($h)) {
                $r = New-Object Native.Desk+RECT; [void][Native.Desk]::GetWindowRect($h, [ref]$r)
                if (($r.R - $r.L) -gt 0 -and ($r.B - $r.T) -gt 0) {
                  $c = New-Object System.Text.StringBuilder 256; [void][Native.Desk]::GetClassName($h, $c, 256)
                  $t = New-Object System.Text.StringBuilder 256; [void][Native.Desk]::GetWindowText($h, $t, 256)
                  $procId = [uint32]0; [void][Native.Desk]::GetWindowThreadProcessId($h, [ref]$procId)
                  $name = (Get-Process -Id $procId -ErrorAction SilentlyContinue).ProcessName
                  $list.Add([pscustomobject]@{ Handle = $h; Process = $name; Pid = $procId; Class = "$c"; Title = "$t"; Rect = "$($r.L),$($r.T) $($r.R - $r.L)x$($r.B - $r.T)" })
                }
              }
              $true }, [IntPtr]::Zero)
            $list
          }
          function Save-Desktop([string]$name) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/od-test-logs" | Out-Null
            $bmp.Save("$env:RUNNER_TEMP/od-test-logs/$name.png")
          }

          "system DPI = $([Native.Desk]::GetDpiForSystem()) (96 = 100%), screen = $([Native.Desk]::GetSystemMetrics(0)) x $([Native.Desk]::GetSystemMetrics(1)), arch = $env:PROCESSOR_ARCHITECTURE, session = $((Get-Process -Id $PID).SessionId)"
          "== visible top-level windows before"
          Get-TopWindows | Format-Table Process, Pid, Class, Title, Rect -AutoSize | Out-String -Width 220
          Save-Desktop 'desktop-as-provisioned'

          # First-logon/privacy UI. The page is hosted by these processes; stop them and keep the
          # experience from being offered again.
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE' -Name DisablePrivacyExperience -Value 1 -Type DWord
          foreach ($name in 'WWAHost', 'CloudExperienceHostBroker', 'UserOOBEBroker', 'OOBENetworkConnectionFlow', 'msoobe') {
            Get-Process -Name $name -ErrorAction SilentlyContinue | ForEach-Object { "stopping $($_.ProcessName) ($($_.Id))"; Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          }
          # Closing the first-logon page drops the session onto an open Start menu over the middle of
          # the screen (it opened a few seconds later and was not in the window list). It is a shell
          # surface that cannot be minimised; Esc closes it and is harmless when nothing is open.
          Add-Type -AssemblyName System.Windows.Forms
          for ($i = 0; $i -lt 3; $i++) {
            Start-Sleep -Seconds 2
            Get-TopWindows | Where-Object { $_.Process -in 'StartMenuExperienceHost', 'SearchHost', 'ShellExperienceHost' } |
              ForEach-Object { "shell surface $($_.Process) '$($_.Title)' $($_.Rect)" }
            [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          }
          # Whatever is still visible and is not the shell gets minimised (SW_MINIMIZE).
          Get-TopWindows | Where-Object { $_.Process -ne 'explorer' -and $_.Class -notin 'Shell_TrayWnd', 'Shell_SecondaryTrayWnd', 'Progman', 'WorkerW' } |
            ForEach-Object { "minimising $($_.Process) '$($_.Title)' [$($_.Class)]"; [void][Native.Desk]::ShowWindow($_.Handle, 6) }

          # windows-11-arm's WSL app runs `wsl.exe --update --confirm --prompt-before-exit` from
          # backgroundTaskHost every 30 s, each time in a new Windows Terminal window that becomes the
          # foreground window over the app under test (the failures named it: WindowsTerminal, title
          # 'C:\Windows\system32\wsl.exe'). A watchdog for the rest of the job stops exactly that
          # command and its window, and records what started it; the runner cleans it up with the job.
          # Its log lands in the uploaded test-log directory. Other wsl.exe processes are left alone:
          # the images' provisioning agent probes WSL with a windowless `wsl -u root -e ls`, which an
          # earlier version of this watchdog stopped as well (provjobd.exe in the log).
          # The retries come from the update never finishing: --prompt-before-exit leaves it waiting for
          # a key, and stopping it counts as a failed update. Finish the update here, before the tests,
          # so the background task has nothing left to do; the watchdog stays as the safety net and its
          # log shows whether it still had to step in.
          if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $update = Start-Process wsl.exe -ArgumentList '--update', '--web-download' -WindowStyle Hidden -PassThru
            if ($update.WaitForExit(300000)) {
              "wsl --update finished with exit code $($update.ExitCode) after $([int]$sw.Elapsed.TotalSeconds) s"
            } else {
              "wsl --update did not finish within 300 s; stopping it"
              Stop-Process -Id $update.Id -Force -ErrorAction SilentlyContinue
            }
            wsl.exe --version 2>&1 | Out-String
          }

          $watchdog = Join-Path $env:RUNNER_TEMP 'desktop-watchdog.ps1'
          $watchdogLog = Join-Path $env:RUNNER_TEMP 'od-test-logs/desktop-watchdog.log'
          Set-Content -Path $watchdog -Value @'
          param([string]$Log)
          while ($true) {
            foreach ($p in @(Get-CimInstance Win32_Process -Filter "Name = 'wsl.exe'" -ErrorAction SilentlyContinue | Where-Object { $_.CommandLine -like '*--update*' })) {
              $parent = Get-CimInstance Win32_Process -Filter "ProcessId = $($p.ParentProcessId)" -ErrorAction SilentlyContinue
              Add-Content $Log "$(Get-Date -Format HH:mm:ss.fff) stopping $($p.Name) ($($p.ProcessId)) '$($p.CommandLine)' started by $($parent.Name) ($($p.ParentProcessId)) '$($parent.CommandLine)'"
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }
            foreach ($t in @(Get-Process -Name WindowsTerminal -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -like '*wsl*' })) {
              Add-Content $Log "$(Get-Date -Format HH:mm:ss.fff) closing WindowsTerminal ($($t.Id)) '$($t.MainWindowTitle)'"
              Stop-Process -Id $t.Id -Force -ErrorAction SilentlyContinue
            }
            Start-Sleep -Milliseconds 500
          }
          '@
          Start-Process pwsh -WindowStyle Hidden -ArgumentList '-NoProfile', '-File', $watchdog, '-Log', $watchdogLog
          Start-Sleep -Seconds 2
          if (Test-Path $watchdogLog) { Get-Content $watchdogLog }

          $full = 0; [void][Native.Desk]::SystemParametersInfo(0x0026, 0, [ref]$full, 0)
          $set = [Native.Desk]::SystemParametersInfo(0x0025, 1, [IntPtr]::Zero, 3)
          $after = 0; [void][Native.Desk]::SystemParametersInfo(0x0026, 0, [ref]$after, 0)
          "drag full windows: was=$full set=$set now=$after"

          Start-Sleep -Seconds 1
          "== visible top-level windows after"
          Get-TopWindows | Format-Table Process, Pid, Class, Title, Rect -AutoSize | Out-String -Width 220
          Save-Desktop 'desktop-before-tests'
          exit 0

      - name: Install GTK designer runtimes and metadata
        if: matrix.needs_gtk && matrix.platform == 'macos-arm64'
        shell: bash
        run: brew install gtk4 libadwaita
      - name: Install Windows GTK designer runtimes and metadata
        id: gtk-msys
        if: matrix.needs_gtk && (matrix.platform == 'windows-x64' || matrix.platform == 'windows-arm64')
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.platform == 'windows-arm64' && 'CLANGARM64' || 'UCRT64' }}
          update: true
          install: ${{ matrix.platform == 'windows-arm64' && 'mingw-w64-clang-aarch64-gtk4 mingw-w64-clang-aarch64-libadwaita' || 'mingw-w64-ucrt-x86_64-gtk4 mingw-w64-ucrt-x86_64-libadwaita' }}
      - name: Verify Windows GTK runtime and metadata
        if: matrix.needs_gtk && (matrix.platform == 'windows-x64' || matrix.platform == 'windows-arm64')
        shell: pwsh
        env:
          GTK_MSYS_ROOT: ${{ steps.gtk-msys.outputs.msys2-location }}
          GTK_PLATFORM: ${{ matrix.platform }}
        run: |
          ./.github/ci/verify-gtk-windows.ps1
          $environment = if ($env:GTK_PLATFORM -eq 'windows-arm64') { 'clangarm64' } else { 'ucrt64' }
          "GTK4_ROOT=$(Join-Path $env:GTK_MSYS_ROOT $environment)" | Add-Content -Path $env:GITHUB_ENV
      # Keyed by the platform whose build job saved the entry, not by this runner: the Windows ARM64 lane runs the
      # windows-x64 build ('buildFrom'), and a runner.arch key made it look for an ARM64 entry nobody saves.
      - id: nuget-key
        name: Compute the package cache key
        if: matrix.needs_nuget_cache
        shell: pwsh
        run: |
          $key = "nuget-${{ matrix.build_platform }}-${{ inputs.through_batch || 'default' }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'NuGet.config', '.github/ci/test-plan.json', 'tests/fixtures/**/*.csproj') }}"
          "key=$key" | Add-Content -Path $env:GITHUB_OUTPUT
      # The IDE host is not self-contained: at run time it resolves the LibreWPF assemblies from the global packages
      # folder, so a lane that starts the IDE needs that folder. Same key the build job saved, and a miss is a failure
      # rather than a silently slower lane that later dies at start-up.
      - name: Restore the NuGet package cache
        if: matrix.needs_nuget_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/nuget-packages
          key: ${{ steps.nuget-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Verify native Terminal package assets
        if: matrix.needs_nuget_cache && (matrix.platform == 'windows-x64' || matrix.platform == 'windows-arm64' || matrix.platform == 'macos-arm64')
        shell: pwsh
        run: ./.github/ci/verify-terminal-assets.ps1 -Platform '${{ matrix.platform }}'
      # The lane must run the architecture its platform promises, against the payload that carries those assets.
      - name: Verify the lane's bitness
        shell: pwsh
        run: ./.github/ci/verify-bitness.ps1 -Platform '${{ matrix.platform }}'
      - name: Diagnose the IDE host start-up
        if: matrix.needs_nuget_cache && inputs.diagnose
        shell: pwsh
        run: ./.github/ci/diagnose-host.ps1
      - name: Run the lane
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
          # The IDE start-up log of every test launch lands here; it is uploaded below.
          OD_TEST_LOG_DIR: ${{ runner.temp }}/od-test-logs
          OD_TEST_KEEP_ARTIFACTS: '1'
          OD_TEST_RESULTS: TestResults
          MSYS2_ROOT: ${{ steps.gtk-msys.outputs.msys2-location }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/run-test-plan.ps1 -Platform '${{ matrix.platform }}' -Lane '${{ matrix.lane }}' -ThroughBatch $through
      # Read-only, after the lane: the pointer journeys inject clicks through cliclick, started by the IDE under
      # this job's process chain, so macOS decides input permission for that chain, not for the step shell the
      # readiness report ran in. The unified log records each decision; keep the input-related ones in the
      # uploaded test-log directory and print the denials and the clients that were asked.
      - name: Report macOS input permission decisions
        if: always() && matrix.platform == 'macos-arm64'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/od-test-logs"
          log_file="$RUNNER_TEMP/od-test-logs/macos-tcc.log"
          sudo log show --last 3h --info --debug --style compact --predicate 'subsystem == "com.apple.TCC" AND (eventMessage CONTAINS "kTCCServicePostEvent" OR eventMessage CONTAINS "kTCCServiceAccessibility" OR eventMessage CONTAINS "kTCCServiceListenEvent")' > "$log_file" 2>&1 || true
          echo "TCC input decisions logged: $(wc -l < "$log_file")"
          grep -iE "den(y|ied)|cliclick|dotnet|OpenDevelop|pwsh" "$log_file" | cut -c1-320 | sort | uniq -c | sort -rn | head -40
      - name: Publish the test results as a check
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: ${{ matrix.lane }} (${{ matrix.platform }})
          path: TestResults/*.trx
          reporter: dotnet-trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.lane }}-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.lane }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/od-test-logs
          if-no-files-found: ignore
          retention-days: 3

  # The lane whose plan definition says 'buildsInLane'. It has no archive and no dependency on the platform build, so
  # its result arrives minutes into the run instead of behind the compile-and-pack job. It compiles only its own entries.
  in-place:
    name: ${{ needs.plan.outputs.in_lane_name }} (${{ needs.plan.outputs.in_lane_platform }}, in place)
    needs: plan
    if: needs.plan.outputs.has_in_lane == 'true'
    runs-on: ${{ needs.plan.outputs.in_lane_runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.in_lane_timeout) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize the submodules the build needs
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ needs.plan.outputs.in_lane_architecture }}
      - id: nuget-key
        name: Compute the package cache key
        shell: pwsh
        run: |
          $key = "nuget-${{ needs.plan.outputs.in_lane_platform }}-${{ inputs.through_batch || 'default' }}-${{ hashFiles('Directory.Packages.props', 'global.json', 'NuGet.config', '.github/ci/test-plan.json', 'tests/fixtures/**/*.csproj') }}"
          Write-Host "cache key: $key"
          "key=$key" | Add-Content -Path $env:GITHUB_OUTPUT
      # Restore only: the build job owns this entry. This lane starts before that job saves it, so a miss here is normal
      # and simply means an uncached restore - saving would spend four minutes compressing a duplicate.
      - name: Restore the NuGet package cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/nuget-packages
          key: ${{ steps.nuget-key.outputs.key }}
      # No host builds: nothing in this lane builds an add-in against the host manifest or starts the IDE.
      - name: Compile this lane's entries
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/build-binaries.ps1 -Platform '${{ needs.plan.outputs.in_lane_platform }}' -Lane '${{ needs.plan.outputs.in_lane_name }}' -SkipHostBuilds -ThroughBatch $through
      - name: Run the lane
        shell: pwsh
        env:
          THROUGH_BATCH: ${{ inputs.through_batch }}
          OD_TEST_LOG_DIR: ${{ runner.temp }}/od-test-logs
          OD_TEST_KEEP_ARTIFACTS: '1'
          OD_TEST_RESULTS: TestResults
        run: |
          $through = -1
          if ($env:THROUGH_BATCH) { $through = [int]$env:THROUGH_BATCH }
          ./.github/ci/run-test-plan.ps1 -Platform '${{ needs.plan.outputs.in_lane_platform }}' -Lane '${{ needs.plan.outputs.in_lane_name }}' -ThroughBatch $through
      - name: Publish the test results as a check
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@v1
        with:
          name: ${{ needs.plan.outputs.in_lane_name }} (${{ needs.plan.outputs.in_lane_platform }}, in place)
          path: TestResults/*.trx
          reporter: dotnet-trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ needs.plan.outputs.in_lane_name }}-in-place
          path: TestResults
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ needs.plan.outputs.in_lane_name }}-in-place
          path: ${{ runner.temp }}/od-test-logs
          if-no-files-found: ignore
          retention-days: 3
