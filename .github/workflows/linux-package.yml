name: Linux package smoke

# A deliberately separate, observational package workflow. It proves the actual ZIP-production
# path on native x64 and ARM64 machines before Linux becomes a required CI/release dependency.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'doc/**'
      - '**/*.md'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # sync-openavalon-feed.ps1 reads this only through gh; it is never written into NuGet.config
  # or the workspace/artifact payload.
  GH_TOKEN: ${{ github.token }}
  NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  package:
    name: Package (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
            dotnet_architecture: x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            dotnet_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize build submodules
        shell: bash
        run: bash .github/ci/init-submodules.sh
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Install Linux display and native runtime prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libx11-xcb1 libxkbcommon0 libgl1
      - name: Build and smoke-test the native Linux ZIP payload
        shell: bash
        run: |
          unset GITHUB_ACTIONS
          xvfb-run -a bash dist.linux.sh --skip-feed-sync
          test -f "OpenDevelop-${{ matrix.rid }}.zip"
          payload="OpenDevelop-${{ matrix.rid }}"
          module="$payload/AddIns/Misc/PackageManagement/Scripts/OpenDevelop.PackageManagement.ps1"
          test -f "$module"
          pwsh -NoProfile -Command ". '$module'; foreach (\$name in 'Get-Package','Install-Package','Update-Package','Uninstall-Package') { Get-Command \$name -ErrorAction Stop | Out-Null }"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-${{ matrix.rid }}
          path: OpenDevelop-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7
