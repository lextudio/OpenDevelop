name: Feature Request
description: Suggest a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - WinForms Designer
        - WPF Designer
        - WinUI Designer
        - XAML Language Service
        - Code Editor (AvalonEdit)
        - Project System (CPS)
        - Build/Deploy
        - Other
    validations:
      required: true
