# Version comes from git tags (v5.4.0 -> 5.4.0), replacing the old hand-maintained
# src/Main/GlobalAssemblyInfo.cs.template + src/Tools/UpdateAssemblyInfo mechanism, whose
# Major/Minor/Build were literal constants no tag could ever change.
# Mirrors the configuration used by the Roma project.
mode: ContinuousDeployment
tag-prefix: 'v'
