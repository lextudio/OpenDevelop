# Version comes from git tags (v5.4.0 -> 5.4.0), replacing the old hand-maintained
# src/Main/GlobalAssemblyInfo.cs.template + src/Tools/UpdateAssemblyInfo mechanism, whose
# Major/Minor/Build were literal constants no tag could ever change.
# Mirrors the configuration used by the Roma project.
mode: ContinuousDeployment
tag-prefix: 'v'
# No automatic bump: a commit after v5.9.3 stays 5.9.3.0. The fourth AssemblyVersion field is fixed at 0 and does
# not track CommitsSinceVersionSource; only a new v tag moves the version.
increment: None
branches:
  main:
    increment: None
    label: ''
  develop:
    increment: None
    label: ''
  feature:
    increment: None
  unknown:
    increment: None
